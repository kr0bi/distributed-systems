<!DOCTYPE html>
   <head>
      <!-- Required meta tags -->
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

      <!-- Bootstrap CSS -->
      <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
      
      <!-- Bootstrap JS-->
      <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
      <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.12.9/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
      <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

      <!-- JQuery -->
      <script type=text/javascript src="{{
         url_for('static', filename='jquery.js') }}"></script>
      <title>ACO System Visualizer</title> 
      <script> 
      $(function () {
        var includes = $('[data-include]')
        $.each(includes, function () {
          var file = 'WebInterface/images/' + $(this).data('include') + '.html'
          $(this).load(file)
        })
        })
      </script> 
   </head>
   <body>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
         <a class="navbar-brand" href="/">ACO System Visualizer</a>
         <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
           <span class="navbar-toggler-icon"></span>
         </button>
         <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
           <div class="navbar-nav">
             <a class="nav-item nav-link active" href="/">Home <span class="sr-only">(current)</span></a>
             <a class="nav-item nav-link" href="/menu">Menu</a>
           </div>
         </div>
      </nav>
      <!-- Alerts -->
      <!-- Status card -->
      <div data-include="graph"></div>


      <!-- Script for real time scale data -->
      <script>
        document.addEventListener("DOMContentLoaded", function(event) {
       
          const getGraphData = function() {
            fetch(`http://${location.host}/update`)  // send request to route /update
              .then((resp) => resp.json())
              .then(function(response) {
                document.getElementById('graphData').innerHTML = response.data.toFixed(2);
            });
          }

          getGraphData();
          setInterval(getGraphData, 1000);  //request for update every 30 seconds
        });
       </script>

   </body>
</html>

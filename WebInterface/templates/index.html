   <body>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
         <a class="navbar-brand" href="/">ACO System Visualizer</a>
         <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
           <span class="navbar-toggler-icon"></span>

             <a class="nav-item nav-link active" href="/">Home <span class="sr-only">(current)</span></a>

         </div>
      </nav>
      <!-- Alerts -->
      <!-- Status card -->
      <div id="graphContent">{% include 'graph.html' %}</div>
      <!-- <div id="includedContent"></div> -->


      <!-- Script for real time scale data -->
      <script>
        document.addEventListener("DOMContentLoaded", function(event) {
       
          const getGraphData = function() {
            fetch(`http://${location.host}/update`)  // send request to route /update
              .then((resp) => resp.json())
              .then(function(response) {
                document.getElementById('graphData').innerHTML = response.data.toFixed(2);
            });
          }

          getGraphData();
          setInterval(getGraphData, 300000);
          window.setTimeout( function() {
            window.location.reload();
          }, 30000);
        });
        function updateDiv()
          { 
              $( "#graphContent" ).load(window.location.href + " #graphContent" );
          }
       </script>

   </body>
</html>
